<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080b14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="cyan-purple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="emerald-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="0%" stop-color="#06b6d4"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow-subtle" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.15)}}@keyframes waveFlow{0%{stroke-dashoffset:0}}@keyframes soundBar{0%{height:12px;y:344px}50%{height:38px;y:318px}}@keyframes soundBar2{0%{height:32px;y:324px}50%{height:14px;y:342px}}@keyframes soundBar3{0%{height:22px;y:334px}50%{height:46px;y:310px}}.wave-line{stroke-dasharray:8 6;animation:waveFlow 4s linear infinite}.orb-glow{transform-origin:center;animation:pulseOrb 6s ease-in-out infinite}.bar-1{animation:soundBar 1.2s ease-in-out infinite}.bar-2{animation:soundBar2 .9s ease-in-out infinite .2s}.bar-3{animation:soundBar3 1.4s ease-in-out infinite .4s}.bar-4{animation:soundBar 1s ease-in-out infinite .3s}.bar-5{animation:soundBar2 1.3s ease-in-out infinite .1s}.pill{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#e2e8f0}</style><rect width="1200" height="400" fill="url(#bg-grad)"/><rect width="1200" height="400" fill="url(#grid)"/><circle cx="180" cy="120" r="140" fill="#06b6d4" class="orb-glow" filter="url(#glow)" opacity=".15"/><circle cx="1020" cy="280" r="180" fill="#8b5cf6" class="orb-glow" filter="url(#glow)" opacity=".18" style="animation-delay:-3s"/><circle cx="600" cy="350" r="130" fill="#3b82f6" class="orb-glow" filter="url(#glow)" opacity=".12" style="animation-delay:-1.5s"/><path fill="none" stroke="url(#cyan-purple)" stroke-width="2.5" d="M 0 270 Q 300 210, 600 270 T 1200 270" class="wave-line" opacity=".4"/><path fill="none" stroke="url(#emerald-cyan)" stroke-width="1.8" d="M 0 290 Q 300 340, 600 290 T 1200 290" class="wave-line" opacity=".35" style="animation-duration:6s"/><g transform="translate(80, 75)"><rect width="285" height="32" x="0" y="0" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.2" rx="16"/><circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#glow-subtle)"/><text x="30" y="21" fill="#67e8f9" class="pill">IOT AUDIO • ESP32 • AIRPLAY 2</text><text x="0" y="90" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5">Awesome IoT Audio &amp; ESP32</text><text x="0" y="145" fill="url(#cyan-purple)" filter="url(#glow-subtle)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5">AirPlay 2 Streaming</text><text x="0" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Curated open-source receivers, bit-perfect multi-room daemons, DSP firmware &amp; lossless network servers</text></g><g transform="translate(980, 0)"><rect width="8" height="36" x="0" y="320" fill="#06b6d4" class="bar-1" opacity=".85" rx="4"/><rect width="8" height="36" x="16" y="320" fill="#3b82f6" class="bar-2" opacity=".85" rx="4"/><rect width="8" height="36" x="32" y="320" fill="#8b5cf6" class="bar-3" opacity=".85" rx="4"/><rect width="8" height="36" x="48" y="320" fill="#a855f7" class="bar-4" opacity=".85" rx="4"/><rect width="8" height="36" x="64" y="320" fill="#06b6d4" class="bar-5" opacity=".85" rx="4"/><rect width="8" height="36" x="80" y="320" fill="#10b981" class="bar-2" opacity=".85" rx="4"/><rect width="8" height="36" x="96" y="320" fill="#3b82f6" class="bar-1" opacity=".85" rx="4"/><rect width="8" height="36" x="112" y="320" fill="#8b5cf6" class="bar-3" opacity=".85" rx="4"/><rect width="8" height="36" x="128" y="320" fill="#06b6d4" class="bar-4" opacity=".85" rx="4"/></g><g transform="translate(80, 320)"><rect width="125" height="28" x="0" y="0" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" rx="6"/><text x="14" y="18" fill="#cbd5e1" class="pill" font-size="12">⚡ ESP32-S3 I2S</text><rect width="155" height="28" x="137" y="0" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" rx="6"/><text x="151" y="18" fill="#cbd5e1" class="pill" font-size="12">📡 AirPlay 2 PTP/RAOP</text><rect width="130" height="28" x="304" y="0" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" rx="6"/><text x="318" y="18" fill="#cbd5e1" class="pill" font-size="12">🔊 Multi-Room Sync</text><rect width="145" height="28" x="446" y="0" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" rx="6"/><text x="460" y="18" fill="#cbd5e1" class="pill" font-size="12">🎛️ CamillaDSP &amp; HiFi</text></g></svg>