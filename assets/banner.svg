<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="0%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes soundBar {
      0%, 100% { height: 12px; y: 344px; }
      50% { height: 38px; y: 318px; }
    }
    @keyframes soundBar2 {
      0%, 100% { height: 32px; y: 324px; }
      50% { height: 14px; y: 342px; }
    }
    @keyframes soundBar3 {
      0%, 100% { height: 22px; y: 334px; }
      50% { height: 46px; y: 310px; }
    }
    .wave-line {
      stroke-dasharray: 8 6;
      animation: waveFlow 4s linear infinite;
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseOrb 6s ease-in-out infinite;
    }
    .bar-1 { animation: soundBar 1.2s ease-in-out infinite; }
    .bar-2 { animation: soundBar2 0.9s ease-in-out infinite 0.2s; }
    .bar-3 { animation: soundBar3 1.4s ease-in-out infinite 0.4s; }
    .bar-4 { animation: soundBar 1.0s ease-in-out infinite 0.3s; }
    .bar-5 { animation: soundBar2 1.3s ease-in-out infinite 0.1s; }
    .pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle cx="180" cy="120" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="orb-glow" />
  <circle cx="1020" cy="280" r="180" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" class="orb-glow" style="animation-delay: -3s;" />
  <circle cx="600" cy="350" r="130" fill="#3b82f6" opacity="0.12" filter="url(#glow)" class="orb-glow" style="animation-delay: -1.5s;" />

  <!-- Dynamic Flowing Audio Waveform Lines in Background -->
  <path d="M 0 270 Q 300 210, 600 270 T 1200 270" fill="none" stroke="url(#cyan-purple)" stroke-width="2.5" opacity="0.4" class="wave-line" />
  <path d="M 0 290 Q 300 340, 600 290 T 1200 290" fill="none" stroke="url(#emerald-cyan)" stroke-width="1.8" opacity="0.35" class="wave-line" style="animation-duration: 6s;" />

  <!-- Foreground Title and Subtitle Container (Clean, Crisp, in Foreground) -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="285" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#glow-subtle)" />
    <text x="30" y="21" class="pill" fill="#67e8f9">IOT AUDIO • ESP32 • AIRPLAY 2</text>

    <!-- Main Title (Strictly Foregrounded with Clear Drop Shadow) -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome IoT Audio &amp; ESP32
    </text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#cyan-purple)" letter-spacing="-0.5" filter="url(#glow-subtle)">
      AirPlay 2 Streaming
    </text>

    <!-- Subtitle -->
    <text x="0" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated open-source receivers, bit-perfect multi-room daemons, DSP firmware &amp; lossless network servers
    </text>
  </g>

  <!-- Interactive/Dynamic Equalizer Bars in Bottom-Right -->
  <g transform="translate(980, 0)">
    <rect x="0" y="320" width="8" height="36" rx="4" fill="#06b6d4" class="bar-1" opacity="0.85" />
    <rect x="16" y="320" width="8" height="36" rx="4" fill="#3b82f6" class="bar-2" opacity="0.85" />
    <rect x="32" y="320" width="8" height="36" rx="4" fill="#8b5cf6" class="bar-3" opacity="0.85" />
    <rect x="48" y="320" width="8" height="36" rx="4" fill="#a855f7" class="bar-4" opacity="0.85" />
    <rect x="64" y="320" width="8" height="36" rx="4" fill="#06b6d4" class="bar-5" opacity="0.85" />
    <rect x="80" y="320" width="8" height="36" rx="4" fill="#10b981" class="bar-2" opacity="0.85" />
    <rect x="96" y="320" width="8" height="36" rx="4" fill="#3b82f6" class="bar-1" opacity="0.85" />
    <rect x="112" y="320" width="8" height="36" rx="4" fill="#8b5cf6" class="bar-3" opacity="0.85" />
    <rect x="128" y="320" width="8" height="36" rx="4" fill="#06b6d4" class="bar-4" opacity="0.85" />
  </g>

  <!-- Feature Tags Along Bottom-Left -->
  <g transform="translate(80, 320)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="125" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="14" y="18" class="pill" font-size="12" fill="#cbd5e1">⚡ ESP32-S3 I2S</text>

    <!-- Tag 2 -->
    <rect x="137" y="0" width="155" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="151" y="18" class="pill" font-size="12" fill="#cbd5e1">📡 AirPlay 2 PTP/RAOP</text>

    <!-- Tag 3 -->
    <rect x="304" y="0" width="130" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="318" y="18" class="pill" font-size="12" fill="#cbd5e1">🔊 Multi-Room Sync</text>

    <!-- Tag 4 -->
    <rect x="446" y="0" width="145" height="28" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" />
    <text x="460" y="18" class="pill" font-size="12" fill="#cbd5e1">🎛️ CamillaDSP &amp; HiFi</text>
  </g>
</svg>